<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ app_name }}{% endblock %}</title>
<style>
:root{--bg:#0b1220;--card:#121b2d;--line:#1f2b45;--text:#e8edf7;--muted:#8496b4;--accent:#4f8cff;--green:#3ddc84;--red:#ff6b6b;--amber:#ffb020}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Roboto,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column}
nav{display:flex;align-items:center;gap:18px;padding:14px 26px;background:linear-gradient(180deg,#121b2d,#0f1728);border-bottom:1px solid var(--line)}
nav .brand{font-weight:700;letter-spacing:.3px;color:var(--accent);font-size:16px}
nav a{color:var(--muted);text-decoration:none;font-size:13px;padding:4px 2px;border-bottom:2px solid transparent}
nav a:hover{color:var(--text)}
nav a.on{color:var(--text);border-bottom-color:var(--accent)}
nav .sp{flex:1}
main{flex:1;width:100%;max-width:1040px;margin:0 auto;padding:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.card h2{font-size:15px;margin-bottom:4px}
.card p.sub{color:var(--muted);font-size:12px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label{color:var(--muted);font-size:12px;display:block;margin-bottom:4px}
input,select{background:#0a1120;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 11px;font-size:13px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.danger{background:transparent;border:1px solid var(--red);color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid #16203a;vertical-align:middle}
tr:hover td{background:#16203a}
td a{color:var(--accent);text-decoration:none}
.tag{display:inline-block;border-radius:10px;padding:2px 9px;font-size:11px;background:rgba(79,140,255,.15);color:var(--accent)}
.tag.g{background:rgba(61,220,132,.15);color:var(--green)}
.tag.r{background:rgba(255,107,107,.15);color:var(--red)}
.tag.a{background:rgba(255,176,32,.15);color:var(--amber)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#9fb0cc;overflow-wrap:anywhere}
.code{background:#0a1120;border:1px solid var(--line);border-radius:8px;padding:12px;font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#9fb0cc;white-space:pre-wrap;overflow-wrap:anywhere}
.drop{border:1px dashed var(--accent);border-radius:12px;padding:26px;text-align:center;background:rgba(79,140,255,.05)}
.drop b{display:block;font-size:15px;margin-bottom:4px}
.drop small{color:var(--muted)}
.flash{padding:11px 15px;border-radius:8px;font-size:13px;margin-bottom:14px}
.flash.success{background:rgba(61,220,132,.12);border:1px solid var(--green);color:var(--green)}
.flash.error{background:rgba(255,107,107,.12);border:1px solid var(--red);color:var(--red)}
.empty{color:var(--muted);font-size:13px;padding:14px 10px}
footer{padding:16px 26px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center}
footer a{color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav>
  <span class="brand">{{ app_name }}</span>
  <a href="{{ url_for('index') }}"{% if request.endpoint == 'index' %} class="on"{% endif %}>Upload</a>
  <a href="{{ url_for('files_page') }}"{% if request.endpoint in ['files_page','file_detail'] %} class="on"{% endif %}>Files</a>
  <span class="sp"></span>
  <a href="{{ url_for('share.list_files') }}">api/files</a>
</nav>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>{{ app_name }} v0.1.0 · self-hosted · <a href="{{ url_for('health') }}">/api/health</a></footer>
{% block scripts %}{% endblock %}
</body>
</html>
